<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Thank You | MUTYA SKIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/checkout.css">
  </head>

  <body>
    <main class="checkout-wrapper">
      <img src="images/logo/clearmutyalogo.png" alt="MUTYA SKIN" style="  width: 200px;">
      <h1>Thank You ✨<br>お買い上げありがとうございます。</h1>
      <p style="text-align:center;">Your order has been placed successfully. <br>ご注文が正常に完了しました</p>

      <div class="section-title">Order Summary <br>ご注文内容</div>
      <div class="order-summary" id="order-summary"></div>

      <a href="index.html" class="pay-btn" style="display:block;text-align:center;">
        Back to Home <br>ホームに戻る
      </a>
    </main>
    <script src="js/lang.js"></script>
    <script>
    const orderBox = document.getElementById('order-summary');
    const order = JSON.parse(localStorage.getItem('lastOrder')) || [];

    let total = 0;

    orderBox.innerHTML = order.map(item => {
      const subtotal = item.price * item.qty;
      total += subtotal;

      return `
        <div class="order-item">
          <span>${item.name} × ${item.qty}</span>
          <span>¥${subtotal.toLocaleString()}</span>
        </div>
      `;
    }).join('');

    orderBox.innerHTML += `
      <div class="total">
        <span>Total</span>
        <span>¥${total.toLocaleString()}</span>
      </div>
    `;
    </script>
  </body>
</html>
